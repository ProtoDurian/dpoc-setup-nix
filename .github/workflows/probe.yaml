name: Gap A probe
on:
  push:
permissions:
  contents: read
  id-token: write
jobs:
  login-debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Install (plain, OIDC present)
        uses: DeterminateSystems/nix-installer-action@main
      - name: Inspect
        shell: bash
        run: |
          set -x
          which -a determinate-nixd || true
          ls -la /nix/var/nix/profiles/default/bin | head -40
          determinate-nixd --version || true
          determinate-nixd login --help || true
          determinate-nixd status || true
      - name: OIDC claims (token itself never printed)
        shell: bash
        run: |
          set -euo pipefail
          tok="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.flakehub.com" | jq -r .value)"
          p="$(cut -d. -f2 <<<"$tok" | tr '_-' '/+')"; while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          base64 -d <<<"$p" | jq '{iss,aud,sub,repository,repository_owner,repository_owner_id,repository_visibility,job_workflow_ref,exp,iat}'
      - name: Time login again, with daemon log
        shell: bash
        run: |
          start=$(date +%s.%N)
          sudo journalctl -u determinate-nixd --no-pager -n 0 --show-cursor > /tmp/cur 2>&1 || true
          cursor="$(sed -n 's/^-- cursor: //p' /tmp/cur)"
          time determinate-nixd login github-action; echo "rc=$?"
          echo "elapsed $(echo "$(date +%s.%N) - $start" | bc)"
          sudo journalctl -u determinate-nixd --no-pager ${cursor:+--after-cursor="$cursor"} -o short-precise | tail -150
      - name: Time a direct FlakeHub token exchange
        shell: bash
        run: |
          tok="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.flakehub.com" | jq -r .value)"
          for u in https://api.flakehub.com/ https://api.flakehub.com/oidc/github https://api.flakehub.com/login/github-action; do
            curl -sS -o /tmp/body -w "$u -> %{http_code} in %{time_total}s\n" -H "Authorization: Bearer $tok" "$u" || true
            head -c 300 /tmp/body; echo
          done
  env-override:
    runs-on: ubuntu-24.04
    steps:
      - name: Install with OIDC env blanked on the step
        uses: DeterminateSystems/nix-installer-action@main
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
      - name: After
        shell: bash
        run: 'echo "url set in later step: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"'
  path-stub:
    runs-on: ubuntu-24.04
    steps:
      - name: Stub determinate-nixd login
        shell: bash
        run: |
          d="$RUNNER_TEMP/atomi-no-flakehub"; mkdir -p "$d"
          printf '%s\n' '#!/bin/sh' 'if [ "${1:-}" = login ]; then echo "FlakeHub login skipped (flakehub-login: false)"; exit 0; fi' 'exec /usr/local/bin/determinate-nixd "$@"' > "$d/determinate-nixd"
          chmod +x "$d/determinate-nixd"; echo "$d" >> "$GITHUB_PATH"
      - name: Install (stub in PATH)
        uses: DeterminateSystems/nix-installer-action@main
      - name: After
        shell: bash
        run: 'which -a determinate-nixd; nix --version'
  no-oidc:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install (no OIDC)
        uses: DeterminateSystems/nix-installer-action@main
