name: Gap A probe
on:
  push:
permissions:
  contents: read
  id-token: write
jobs:
  login-debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Install (plain, OIDC present)
        uses: DeterminateSystems/nix-installer-action@main
      - name: Daemon log of the installer's login
        shell: bash
        run: |
          sudo journalctl -u determinate-nixd --no-pager -o short-precise | grep -iv 'nix-daemon\|accepted connection' | tail -80 || true
      - name: determinate-nixd knobs (env vars and hosts it knows)
        shell: bash
        run: |
          strings /usr/local/bin/determinate-nixd | grep -oE '(DETERMINATE|FLAKEHUB|DETSYS)_[A-Z_]+' | sort -u | head -60 || true
          strings /usr/local/bin/determinate-nixd | grep -oE 'https://[a-z.]*flakehub[a-z.]*[^" ]{0,40}' | sort -u | head -30 || true
      - name: Time login again, verbose, with daemon log
        shell: bash
        run: |
          c="$(sudo journalctl -u determinate-nixd -n 0 --show-cursor --no-pager | sed -n 's/^-- cursor: //p')"
          s=$(date +%s.%N)
          RUST_LOG=debug determinate-nixd login github-action || echo "rc=$?"
          echo "elapsed $(echo "$(date +%s.%N) - $s" | bc)"
          sudo journalctl -u determinate-nixd --no-pager --after-cursor="$c" -o short-precise | tail -120 || true
      - name: FlakeHub API with our OIDC token (token itself never printed)
        shell: bash
        run: |
          tok="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.flakehub.com" | jq -r .value)"
          for u in https://api.flakehub.com/token/create/github https://api.flakehub.com/cache/token https://api.flakehub.com/token; do
            curl -sS -X POST -o /tmp/body -w "POST $u -> %{http_code} in %{time_total}s\n" -H "Authorization: Bearer $tok" "$u" || true
            head -c 300 /tmp/body; echo
          done
      - name: Login with api.flakehub.com blackholed vs refused
        shell: bash
        run: |
          echo "127.0.0.1 api.flakehub.com" | sudo tee -a /etc/hosts
          s=$(date +%s.%N); determinate-nixd login github-action || echo "rc=$?"; echo "refused elapsed $(echo "$(date +%s.%N) - $s" | bc)"
